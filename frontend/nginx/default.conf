map $request_uri $docgraph_request_path {
    default $request_uri;
    ~^(?<path_without_query>[^?]*)(?:\?.*)?$ $path_without_query;
}

log_format docgraph_safe '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $docgraph_request_path $server_protocol" '
                         '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
access_log /var/log/nginx/access.log docgraph_safe;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 后端 MAX_FILE_SIZE_MB=50，这里留出冗余；不设会导致大文件上传 413
    client_max_body_size 60m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # HSTS 只能在最外层 TLS 终结处启用。本容器自身监听 HTTP；
    # 若前置代理负责 HTTPS，应在其 HTTPS server 配置：
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # 不要把本 HTTP 服务直接暴露公网，也不要在纯 HTTP 入口发送 HSTS。

    # 同源反向代理：前端 axios baseURL 是相对路径 /api，无需任何构建期变量
    location /api/ {
        proxy_pass http://backend:8800;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 规则解析 / LLM 审查 / OCR 链路都很慢，默认 60s 会被截断
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
