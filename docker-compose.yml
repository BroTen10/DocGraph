name: docgraph

services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:16-alpine
    container_name: doc-review-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DB:-doc_review}
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD must be set}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${PG_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  neo4j:
    image: public.ecr.aws/docker/library/neo4j:5.26.0-community
    container_name: doc-review-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-17687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      # 用无凭据的 HTTP 探针（GET / 返回发现信息，无需认证）：
      # 原先用 cypher-shell 带容器内环境变量的口令做校验，口令一旦在库内轮换过，
      # 容器里的旧值就永远认证失败，健康检查会一直误报 unhealthy。
      test: ["CMD-SHELL", "wget -q --spider --timeout=3 http://localhost:7474/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    # 只在 --profile deploy 下纳入编排：裸 `docker compose up -d` 仍然只起数据库，
    # 本地开发（venv + Vite dev server）不受影响。deploy.sh 已默认带该 profile。
    profiles: ["deploy"]
    build:
      context: ./backend
      # 版本信息：容器内没有 .git，由 deploy.sh 算好后经 build args 注入镜像 ENV
      # （宿主 shell 未设这些变量时为空，镜像会如实报 0.0.0 / unknown，不伪造版本）
      args:
        DOCGRAPH_APP_VERSION: ${DOCGRAPH_APP_VERSION:-}
        DOCGRAPH_GIT_COMMIT: ${DOCGRAPH_GIT_COMMIT:-}
        DOCGRAPH_GIT_DESCRIBE: ${DOCGRAPH_GIT_DESCRIBE:-}
        DOCGRAPH_GIT_TAG: ${DOCGRAPH_GIT_TAG:-}
        DOCGRAPH_GIT_BRANCH: ${DOCGRAPH_GIT_BRANCH:-}
        DOCGRAPH_GIT_DIRTY: ${DOCGRAPH_GIT_DIRTY:-}
        DOCGRAPH_BUILD_TIME: ${DOCGRAPH_BUILD_TIME:-}
        DOCGRAPH_BUILD_ENV: ${DOCGRAPH_BUILD_ENV:-prod}
    image: docgraph-backend:local
    container_name: docgraph-backend
    restart: unless-stopped
    # 机密与业务配置放 backend/.env（不入 git）；deploy.sh 会在缺失时从 .env.example 生成
    env_file:
      - ./backend/.env
    # environment 优先级高于 env_file：容器内一律用 compose 服务名与容器内端口，
    # 不沿用 .env 里给宿主机开发用的 localhost:15432 / localhost:17687
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "8800"
      APP_DEBUG: "false"
      API_DOCS_ENABLED: "false"
      PG_HOST: postgres
      PG_PORT: "5432"
      NEO4J_URI: bolt://neo4j:7687
      UPLOAD_ROOT: /data/uploads
      TRUST_PROXY_HEADERS: "true"
    volumes:
      - uploads_data:/data/uploads
    ports:
      # 只绑定回环：统一从前端 nginx 的 /api 进入，并让代理头信任边界保持受控
      - "127.0.0.1:${BACKEND_HOST_PORT:-8800}:8800"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  frontend:
    profiles: ["deploy"]
    build:
      context: ./frontend
      args:
        DOCGRAPH_APP_VERSION: ${DOCGRAPH_APP_VERSION:-}
        DOCGRAPH_GIT_COMMIT: ${DOCGRAPH_GIT_COMMIT:-}
        DOCGRAPH_GIT_DESCRIBE: ${DOCGRAPH_GIT_DESCRIBE:-}
        DOCGRAPH_GIT_TAG: ${DOCGRAPH_GIT_TAG:-}
        DOCGRAPH_GIT_BRANCH: ${DOCGRAPH_GIT_BRANCH:-}
        DOCGRAPH_GIT_DIRTY: ${DOCGRAPH_GIT_DIRTY:-}
        DOCGRAPH_BUILD_TIME: ${DOCGRAPH_BUILD_TIME:-}
        DOCGRAPH_BUILD_ENV: ${DOCGRAPH_BUILD_ENV:-prod}
    image: docgraph-frontend:local
    container_name: docgraph-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  # 上传的业务单据（含真实合同），独立卷便于备份/迁移
  uploads_data:
