# 通用贸易文档审查规则解析 Skill（内置默认配置）
# 覆盖场景：出口（代理/自营/退税/不退税）、进口、转口、内贸
# 四维度：齐套性 / 基础判断 / 信息准确性 / 时间逻辑

prompt_instructions:
- 文件类型从以下枚举选择：报关单、委托出口确认单、代理协议、采购合同、销售合同、商业发票、装箱单、提单（海运提单/空运提单）、原产地证、保险单、报关委托书、产品清单、出入仓单、派车单、运输单据（运输合同/运单）、水单（收汇/付汇水单）、形式发票、信用证、质检单、重量单、报关单草稿
- 检查项从以下枚举选择：齐套性、基础判断、信息准确性、时间逻辑
- 若规则涉及的文件类型或检查项不在枚举中，可提出合理的新类型名
- 齐套性规则聚焦：关键单据是否齐全、是否缺失、是否有替代文件。例如 代理协议缺少双方回签、缺少运输单据（运输合同和运单至少有一份）
- 条件齐套用 condition 标记：若规则前置条件为仅当某场景或某系统选项开启时才必备，补充 condition 字段说明前置条件
- 多选一检查（any_of/all_of）需在 rule_text 中明确列举备选文件组合
- 基础判断聚焦：用印一致性（印章匹配）、签章完整性、企业与单据关联关系（如报关行需与委托单一致）
- 一致类规则（应一致/应匹配/不能不一致）拆为 operator== 断言
- 字数统计、金额=数量×单价等计算校验归入基础判断
- 信息准确性聚焦：金额比对、数量比对、产品信息（名称/型号/HS编码）一致性
- '金额比对用 operator: ≤ / == / ≠，显式写出比较方向。如 报关单金额不可大于委托单金额 对应 operator: ≤'
- '数量比对同样处理：出口数量不可大于委托数量 对应 operator: ≤'
- 存在大合同分批或总量校准时须标注 scope 说明，如合同总量控制
- 时间逻辑聚焦：日期先后关系、有效期覆盖、合同期限
- 时间链规则需按时间先后顺序输出，标注 pairwise（如 A 不早于 B、B 不早于 C）
- 常见日期字段：签订日期、报关日期、装运日期、提单日期、发票日期、有效期至、交货日期
- 每条规则只含一个断言。若原文含多条规则，分别拆为独立条目输出
- rule_text 用简洁中文描述，例如 报关单数量应不大于委托单数量
- 比较方向必须显式输出 operator 字段（可选值：==/≤/≥/≠/覆盖/加总≤），禁止用 匹配 对应 等模糊词
- 规则若明确写 待人工确认 交人工判定 等词，severity 设为 warning，不设为 error
- 若规则含例外条款（如 税款除外 另有约定除外），保留为 exception 字段
- tolerance 只在规则涉金额/重量/时间比对时填写，否则留 null；硬比较（不可大于/必须一致）tolerance 填 0
- 若原文缺失比较阈值或参考对象，标记缺陷类型 incomplete_condition
field_mappings:
  check_category:
    齐套: 齐套性
    基础: 基础判断
    信息: 信息准确性
    时间: 时间逻辑
    必备性: 齐套性
  severity:
    人工确认: warning
    人工判定: warning
    人工核实: warning
defaults:
  priority:
    齐套性: 10
    基础判断: 20
    信息准确性: 30
    时间逻辑: 40
  tolerance:
    amount_percent: 0
    weight_kg: 0
validations:
- rule: 值必须在 0-100 之间
  field: defaults.tolerance.amount_percent
  message: 金额容差超出 0-100 范围，请修正
  severity: error
- rule: 值必须 >= 0
  field: defaults.tolerance.weight_kg
  severity: error
- rule: 同一条 rule 的 scope 组合不应出现相反 operator 的同字段规则
  severity: warning
text_preprocessing:
- type: regex
  pattern: 我我司
  replacement: 我司
- type: regex
  pattern: (\.\.+|…+)
  replacement: …
- type: regex
  pattern: \b\d+\)(?!\s*[\u4e00-\u9fff])
  replacement: ''
- type: regex
  pattern: (?<=\d)\.(?=\s*[A-Za-z\u4e00-\u9fff])
  replacement: 。
- type: regex
  pattern: \s{3,}
  replacement: ' '
term_normalization:
  委托出口确认单:
  - 委托出口代理订单
  - 委托确认单
  报关单:
  - 出口报关单
  - 进口报关单
  - 报关单草稿
  代理协议:
  - 代理合同
  - 委托代理协议
  水单:
  - 银行水单
  运输单据:
  - 运输合同
  - 运单
  出入仓单:
  - 入库单
  - 出库单
  - 入仓单
  - 出仓单
  商业发票:
  - 形式发票
  - 贸易发票
  产品清单:
  - 产品明细
  - 规格明细
  派车单:
  - 运输派车单
domain_context:
  glossary:
    齐套性: 检查规定过程文件是否齐全、完备
    基础判断: 检查文件的印章、签章、企业关联等基础信息
    信息准确性: 检查金额、数量、产品信息等数据准确性
    时间逻辑: 检查日期、期限等时间关系的合理性
    N9B系统: 贸易业务管理系统，存储合同、订单、出入仓等信息
    HS编码: 海关编码，用于商品归类
    回签: 合同双方签字盖章确认
    大合同: 框架性采购/销售合同，分批执行
    虚仓: 不在实体仓库中转存储的业务场景
    委托出口: 委托第三方代理公司办理出口业务
    出口自营: 企业自行办理出口业务
    进口代理: 委托第三方代理公司办理进口业务
    转口: 货物经第三国/地区转运的贸易方式
    内贸: 国内贸易，不涉及海关报关
    备案印章: 在合同中备案的额外可用印章
    多币种: 同一单据涉及多种外币
  common_patterns:
  - 金额比对类规则通常涉及报关单金额 vs 委托单金额，或商业发票金额 vs 形式发票金额
  - 数量比对类规则通常涉及报关单数量 vs 委托单数量，或出入仓数量 vs 出入库通知数量
  - 日期逻辑类规则：签订日期 < 报关日期 < 提单日期 < 装运日期 < 发/收货日期
  - 用印规则：法人章/公章/报关专用章三者关系，回签文件印章与备案印章比对
  - 产品信息：产品名称/规格型号/HS编码在报关单、委托单、商业发票间一致
  - 大合同与分批单：分批金额之和不可超过大合同总额
  - 提单场景：海运提单与空运提单是替代关系（any_of），非同时必备
  - 出入仓：入库数量应与采购/收货数量一致，出库数量应与销售/发货数量一致
