# 通用贸易文档审查规则解析 Skill（内置默认配置）
# 权威运行文件：backend/app/default_rule_parse_skill.yaml

prompt_instructions:
  - "你是贸易合同过程文件规则的结构化解析器。目标是将客户原文转换为可独立复核、可追溯、可由确定性图谱或 LLM 语义审查执行的规则，不改变原文业务含义。"
  - "先识别输入是普通段落还是二维规则表。对规则表，先识别贸易类型、模式、过程文件、必备性、基础判断、信息准确性、时间逻辑等列；把同一数据行的贸易类型、模式与过程文件视为一个规则族，再拆解各判定。"
  - "表格合并单元格的值必须继承到其覆盖的每个规则族。不得因后续物理行为空而丢失贸易类型、模式、文件类型或其他上级上下文。"
  - "原子规则以一个可独立得出通过、不通过或无法核验结论的判定为边界。同一编号或分句中的独立比较、日期关系、单据形式要求应分别成条。"
  - "同一句表达“任一文件满足”“文件组合二选一”“至少一项满足”时，必须保留组合关系，禁止拆成若干个独立强制必备规则。"
  - "按主要检查目的归入齐套性、基础判断、信息准确性、时间逻辑四类：必备/缺失/替代→齐套性；印章、签章、版本、格式、关联→基础判断；字段比较与内容一致性→信息准确性；日期先后和区间→时间逻辑。条件不改变检查类别。"
  - "文件类型列和原文明确涉及的实际单据写入 scope.doc_types；单一文件规则可同时填写 doc_type。不要将业务场景、模式或检查目的伪装成文件类型。"
  - "当前系统会丢弃 scope 中除 doc_types、intents 外的自定义维度。贸易类型、模式等场景上下文应写入 rule_text，并在可用时写入 structure.condition.text；不要新增 scope.trade_type、scope.mode 等字段。"
  - "无条件且只针对一个确定文件的必备规则，填写 doc_type 与 check_category=齐套性。条件必备、任一组合、至少一项或跨多个候选文件的齐套规则不要填写单一 doc_type，用 scope.doc_types 列候选文件，并把触发条件和组合逻辑写入 rule_text 与 structure.condition。"
  - "输入行带 [SOURCE_ROW=...] 时逐行解析并原样回填 source_ref。同一来源行可以拆成多条规则并共享 source_ref，禁止因文本相似而合并不同来源行。跨行组合语义不能作为吞掉来源行的理由。"
  - "rule_text 使用简洁、完整、可判定的中文陈述句。写明被检文件、比较对象和比较方向；跨文件规则写出双方文件全名。原文使用英文术语或缩写时保留英文，并以中文括号解释首次出现的含义。"
  - "一个比较句中列出多个分别取值的字段时，按字段拆成独立规则。例如产品名称、规格型号一致，数量、金额不大于另一方，应拆为四条规则。同一字段完整性要求中的字段清单可保留为一条，除非其中字段另有独立相等或大小断言。"
  - "日期逻辑一条规则只比较一对明确时间锚点。有效期覆盖或日期位于区间内时拆为起止两条边界断言，例如开始日不晚于目标日、结束日不早于目标日。"
  - "时间比较必须保持原文方向，使用“时间不早于”“时间不晚于”“时间早于”“时间晚于”等明确表达。原文“不早于/不晚于”应允许同日，原文“早于/晚于”不允许同日。"
  - "如果原文时间方向明显违背一般业务常识，仍按字面生成，同时在对应规则 defects 中标记 uncertainty 并说明疑似方向错误，交人工确认；不得自行反转。"
  - "例外条款必须并入主规则。rule_text 保留完整例外，structure.exceptions 同步记录；可从字段求值的例外填写 field/operator/value，纯文本例外只填 text 和 reason。"
  - "原文中的“可以接受”“建议人工确认”“待补充说明”等复核策略应保留触发条件和复核意图，不能丢弃，也不能改写成无条件的硬性通过。不要输出系统规则契约之外的顶层 severity 字段。"
  - "简单要求“某文件应具备任意印章”时可填写具体 doc_type 走基础判断图谱。印章主体、双方用印、双方回签、印章一致性、正本、版本、非草稿或非可编辑格式等要求省略单一 doc_type，用 scope.doc_types 指向文件并保留完整 rule_text 交由语义审查，避免被仅检查 has_stamp 的图谱错误简化。"
  - "只有原文明确给出双方文件与字段时才填写 structure.assertion；source/target 必须来自原文或已登记字段。与业务系统界面、附件或人工记录比较但没有可用的 target 字段时，保留完整 rule_text，不虚构系统文档类型或字段。"
  - "过程说明、采集方式、后续规划、内部操作备注不属于审查规则，不得生成可通过或不通过的判定。"
  - "规则文本相似但文件类型、业务场景、触发条件、比较方向、组合关系或例外任一项不同，必须分别输出。跨客户或跨场景的相似描述不得因字面相似而合并。"
  - "ontology 复用原文中的规范全称；只有实际存在且无歧义的单据才登记为新文件类型。组合集合和虚拟分组不得借 ontology 创建成虚构单据。"
  - "无明确容差时不猜宽容差。金额、数量、重量和日期只有原文或文档规则明确给阈值、百分比、天数或同日策略时才填写 tolerance；硬比较填 0。"
  - "输出前逐项自查：业务场景是否保留；条件是否随规则走；组合齐套是否仍完整；数字比较方向是否正确；日期是否只含一对锚点；例外是否未丢失；来源行是否未跨行合并；是否存在只能由语义审查处理却被错误填入 structure.assertion 的规则。"

field_mappings:
  check_category:
    齐套: 齐套性
    必备性: 齐套性
    完整性: 齐套性
    基础: 基础判断
    形式审查: 基础判断
    单据基础: 基础判断
    信息: 信息准确性
    内容准确性: 信息准确性
    数据校验: 信息准确性
    时间: 时间逻辑
    日期校验: 时间逻辑
    时间校验: 时间逻辑

defaults:
  priority:
    齐套性: 10
    基础判断: 20
    信息准确性: 30
    时间逻辑: 40
  tolerance:
    amount_percent: 0
    weight_kg: 0
    quantity: 0
    time_days: 0

validations:
  - field: check_category
    rule: 值必须属于 齐套性、基础判断、信息准确性、时间逻辑
    message: 检查类别 '{value}' 非法
    severity: error
  - field: rule_text
    rule: 信息准确性和时间逻辑规则必须包含明确比较关系
    message: 规则缺少可判定的比较关系
    severity: error
  - field: tolerance.amount_percent
    rule: 值必须在 0-100 之间
    message: 金额容差 '{value}' 超出 0-100 范围，请修正
    severity: error
  - field: tolerance.weight_kg
    rule: 值必须 >= 0
    message: 重量容差 '{value}' 不得小于 0
    severity: error
  - field: tolerance.quantity
    rule: 值必须 >= 0
    message: 数量容差 '{value}' 不得小于 0
    severity: error
  - field: tolerance.time_days
    rule: 值必须 >= 0
    message: 时间容差 '{value}' 不得小于 0
    severity: error

text_preprocessing:
  - type: replace
    pattern: '我我司'
    replacement: '我司'
    description: 修正常见重复字
  - type: replace
    pattern: '1\.\.'
    replacement: '1.'
    description: 修正编号前的重复句点
  - type: replace
    pattern: '(?m)^\s*(\d+)\.\s*\n+\s*'
    replacement: '\1.'
    description: 拼回被物理换行截断的编号
  - type: replace
    pattern: '[ \t]{3,}'
    replacement: ' '
    description: 压缩 PDF 版面产生的连续空白，保留换行

term_normalization: {}

domain_context:
  glossary:
    齐套性: "检查规定过程文件是否齐全、完备，或是否满足指定的替代组合。"
    基础判断: "检查单据本身的印章、签章、版本、正本状态、可编辑性和关联关系等，不主要判断业务字段数值。"
    信息准确性: "检查金额、数量、产品属性、主体名称及其他业务字段的一致性或大小关系。"
    时间逻辑: "检查单据日期、合同日期、报关日期、物流日期和有效期之间的先后或覆盖关系。"
    回签: "合同或协议双方签署并盖章确认的版本。"
    条件齐套: "只有业务场景或系统选项满足原文条件时才要求提供某文件。"
    组合齐套: "多个文件之间采用任一、二选一、至少其一或组合替代关系，不应拆成每个文件都必须提供。"
    大合同分批: "框架合同分批执行时，单次单据数量可与合同总量不同，应按原文检查累计关系及是否需人工确认。"
    临时仓库或虚拟仓库: "系统选项中表示不经过普通实体仓储或采用特殊物流路径的业务场景；是否触发派车或出入仓单据必须依据原文。"
    备案印章: "协议或业务系统内登记的其他可用印章说明；仅在原文明确允许时作为印章不一致的例外依据。"
    人工确认: "原文要求的提示、补充材料或人工复核策略。解析时必须保留触发条件，不能删除或改为硬性通过。"
    业务系统: "客户内部的合同、订单、制单、报关或附件管理系统。原文使用 N9B 等具体名称时应保留原名。"
  common_patterns:
    - "金额和数量比较通常涉及合同、委托确认单、订单、报关单、发票、签收单或出入仓单；具体双方必须以原文为准。"
    - "日期关系应逐对提取，不要预设所有业务都遵循同一条固定时间链；同一业务类型的代理、自营、进口、出口场景可能有相反方向。"
    - "单证基础要求通常包含是否存在、是否用印、由谁用印、是否回签、是否正本扫描和是否可编辑，这些证据维度应分开判断。"
    - "多文件替代关系常见于运输资料、采购订单或销售订单确认、出入仓与派车资料；只有原文明确时才能使用 any_of 语义。"
    - "业务场景、模式和条件必须随每条拆出的规则保留，否则相似规则会被错误应用到其他客户或其他贸易路径。"
    - "原文列出系统界面或内部附件作为比较对象时，应保留其全名和字段清单；缺少可执行 target 字段时由语义审查处理，不编造图谱节点。"
    - "相同规则文本可能因业务场景、文件角色、条件或例外不同而成为不同规则，场景上下文优先于字面相似度。"
