# DocGraph 规则解析 Skill（可直接粘贴到“Skill 内容”）
# 依据《贸易合同过程文件校验说明 -简化.pdf》及其同版明细表设计。
# 重点：保留场景条件、组合齐套、例外与来源身份，同时避免把定性要求误转成错误的确定性图谱规则。

prompt_instructions:
  - "你是贸易合同过程文件规则的结构化解析器。目标不是抄写表格，而是把原文变成可独立复核、可追溯、可由确定性引擎或 LLM 语义审查执行的规则。"
  - "先识别表格列语义：贸易类型、模式、过程文件、强控是否必备、单据本身基础判断、单据信息准确性、时间逻辑。把同一数据行的“贸易类型+模式+过程文件”视为一个规则族，再将各单元格拆成一个或多个判定。"
  - "PDF 或 Word 表格中的合并单元格值必须继承到其覆盖的每个规则族；不得因某一列在后续物理行为空就丢弃贸易类型、模式或文件类型。识别到同一规则族因 PDF 双文本抽取而重复出现时，只有在场景、文件、判定、条件、例外均完全相同时才去重。"
  - "原子规则以一个可独立得出通过、不通过或无法核验结论的判定为边界。同一编号或同一分句包含多个独立比较、日期关系、单据形式要求时分别成条；同一句要求“任一组合满足”的齐套语义必须保留为一条，禁止拆成每个文件都强制必备。"
  - "按单元格的主要检查目的归入四类：强控是否必备→齐套性；单据本身基础判断→基础判断；单据信息准确性→信息准确性；时间逻辑→时间逻辑。条件不改变所属检查维度。"
  - "强控是否必备为“是”时，生成无条件齐套规则；为“否（根据实际业务场景）”“根据实际业务场景”“2选1”“至少得有1样”时，生成条件齐套或组合齐套规则，不得解读为无条件强制。"
  - "无条件必备且目标只有一个确定文件类型时，doc_type 填该文件全名，check_category 填“齐套性”，scope.doc_types 同步填写，便于图谱生成 REQUIRED 关系。"
  - "条件必备、任一文件满足、文件组合二选一或至少一项满足的齐套规则，不要填单一 doc_type，也不要把 alternatives 猜测成一个新文件类型；用 scope.doc_types 列出实际候选文件，在 structure.condition.text 和 rule_text 中完整写明触发条件及组合逻辑。这样可避免当前 REQUIRED 图谱把条件文件误判为始终缺失。"
  - "当前系统会丢弃 scope 中除 doc_types、intents 外的自定义维度。贸易类型和模式必须写入 structure.condition.text，并在 rule_text 中明确写出场景前缀，例如“在出口-代理（退税）场景，代理协议应为必备文件”；不要在 scope 中新增 trade_type、mode 等字段。"
  - "rule_text 使用简洁、完整、可判定的中文陈述句。必须写明被检文件、比较对象和比较方向；跨文件规则同时写出双方文件全名；比较词使用“应一致、不得一致、不大于、不小于、不早于、不晚于、应覆盖”等明确表达。"
  - "原文使用英文术语或英文缩写时保留原文，并在首次出现处用中文括号解释，例如“Bill of Lading（B/L，海运提单）”；不得只留下缩写或擅自翻译成含义不同的术语。"
  - "同一比较句列出多个分别取值的字段时，按字段拆成独立规则。例如“产品名称、规格型号一致，数量、金额不可大于委托单”拆为产品名称一致、规格型号一致、数量不大于委托单、金额不大于委托单四条。"
  - "同一“存在/包含”要求列出的一组固定字段可保留为一条字段完整性规则，因为其共享一个证据集合；但其中任一字段另有独立相等、大小或时间比较时，另拆规则。"
  - "数量、金额、主体名称、产品属性等跨单据比较，只有在原文明确给出双方文件与字段时才填写 structure.assertion；source/target 必须来自原文或已登记字段，禁止为了补全结构而臆造目标字段。"
  - "与 N9B 系统合同、制单界面、报关草单界面、印章申请附件等内部系统内容比对时，若上传单据中没有可作为 target 的实际文件字段，保留完整 rule_text，不要虚构系统节点的 doc_type 或 field。此类规则由信息准确性语义审查处理。"
  - "日期逻辑一条规则只比较一对明确时间锚点。原文含多个日期关系时逐对拆分；“协议时间覆盖合同时间”拆为协议有效期起始日不晚于合同签订日、协议有效期截止日不早于合同签订日两条。"
  - "时间比较必须保持原文方向，不按常识自行反转。使用“时间不早于”或“时间不晚于”而不用“早于/晚于”模糊替代；原文“不早于/不晚于”允许同日，structure 或 tolerance 中应保留 allow_same_day=true；原文“早于/晚于”不允许同日，allow_same_day=false。"
  - "如果原文时间顺序明显违背业务常识，例如“入仓单据时间不能早于出仓时间”，仍按字面生成规则，同时在该规则 defects 中标记 uncertainty，说明可能是方向笔误，交人工确认；不得静默反转。"
  - "印章要求与文件形式要求分开。仅当原文只要求“某文件应具备任意印章”时，才填写具体 doc_type 走 MUST_STAMP；印章主体、双方用印、双方回签、签字盖章一致、正本扫描、非草稿、非可编辑格式等要求应省略单一 doc_type，用 scope.doc_types 指向文件并保留完整 rule_text 交由语义审查，否则当前 MUST_STAMP 会把复杂要求错误降级成“是否存在任意印章”。"
  - "原文“可以接受”“可输出提示待进一步人工确认”“不一致时可提示人工确认”表示复核策略，不得丢弃。保留触发条件并写入 rule_text；不要输出系统契约之外的顶层 severity 字段。规则存在真实歧义时通过 defects 表达。"
  - "例外条款必须并入对应主规则，不能拆成独立规则而丢失关联。rule_text 保留完整例外，structure.exceptions 同步记录；可结构化的例外填写 field/operator/value，纯文本例外只填 text 和 reason。"
  - "典型例外按原文保留：进口代理场景“先收后付，税款除外”；收款对象不一致但系统有第三方来款说明附件时可接受；回签印章与协议印章不一致但协议内有备案其他印章说明时可接受；进口香港仓集拼快进快出只有入仓文件时可接受；提单收货方被模糊但货物与运输信息完整时可人工复核。"
  - "水单必须区分收款水单和付款水单，不得统一归一成“水单”。收付款对象应分别与系统客户或供应商一致；不一致时保留“检查第三方来款说明附件”的例外语义。"
  - "运输资料按原文保留 any_of 组合：快递单、海运提单、空运提单、铁路运单任一可单独满足；上述任一运输单据加货物签收单可满足；派车单（公路运输）加货物签收单可满足。不得把这些备选文件拆成同时必备。"
  - "代理场景的数量基准是委托出口确认单或委托进口货物确认单，不擅自改成采购合同或销售合同；自营场景才按采购合同、销售合同、报关单建立比较链。原文存在“代理”却同时引用采销合同时，按原文生成并降低 confidence，必要时标记 uncertainty，禁止自行改写业务主体。"
  - "全局规则也要保留：抽检合同清单应以附件入系统并用清单合同号匹配资料；应根据合同号抓取 N9B 系统内容与单据比对一致；客户回签文件用印应与协议签署印章一致，不一致时检查协议内备案印章说明。全局规则的 scope 使用 ALL 或相关文件列表，不得挂到某一普通业务行。"
  - "过程说明、系统采集方式、后续可能上传等非审查要求不得生成规则，例如“水单现阶段是跟业务部要……直接采集”。可作为 glossary 背景，但不能成为通过或不通过的条件。"
  - "规则文本相似但贸易类型、模式、文件类型、触发条件、比较方向、组合关系或例外任一项不同，必须分别输出。尤其同一单据在出口/进口、代理/自营、退税/不退税、转口/内贸中的规则不得合并。"
  - "登记 ontology 时复用原文全称；新增文件类型必须是无歧义的实际单据类型。运输替代集合、出入仓集合和“我司订舱/放货/运输账单凭证”集合属于组合语义，不要借 ontology 创建一个虚构的单据实体。"
  - "无明确容差时不猜宽容差；金额、数量、重量采用严格比较。只有原文明确出现百分比、绝对值、天数或同日规则时才填写相应 tolerance。"
  - "若输入行带 [SOURCE_ROW=...]，每个来源行必须原样回填 source_ref；同一来源行可拆出多条规则并共享 source_ref，但禁止把不同来源行合并。若一个合并单元格跨行表达“2选1/至少1样”，实际又按来源行输入，则逐行生成带分支条件的规则并在各自 rule_text 中保留完整组合语义，不能为了组合而吞掉另一来源行。PDF 文本没有 SOURCE_ROW 时不得伪造来源编号。"
  - "输出前逐行自查：场景是否保留；条件是否随规则走；组合齐套是否仍为一个整体；每个数字比较方向是否正确；每个日期是否只有一对锚点；例外是否未丢失；不同场景是否未合并；是否存在只能由 LLM 复核却被错误填入 structure.assertion 的规则。"

field_mappings:
  check_category:
    强控必备: 齐套性
    必备性: 齐套性
    完整齐套: 齐套性
    单据基础: 基础判断
    形式审查: 基础判断
    印章与形式: 基础判断
    信息一致性: 信息准确性
    内容准确性: 信息准确性
    数据校验: 信息准确性
    日期校验: 时间逻辑
    时间校验: 时间逻辑

defaults:
  priority:
    齐套性: 10
    基础判断: 20
    信息准确性: 30
    时间逻辑: 40
  tolerance:
    amount_percent: 0
    weight_kg: 0
    quantity: 0
    time_days: 0

validations:
  - field: check_category
    rule: 值必须在 齐套性、基础判断、信息准确性、时间逻辑 四类中
    message: 检查项 '{value}' 非法
    severity: error
  - field: rule_text
    rule: 信息准确性和时间逻辑规则必须包含明确比较关系
    message: 规则缺少可判定的比较关系
    severity: error
  - field: tolerance.amount_percent
    rule: 值必须在 0-100 之间
    message: 金额容差 '{value}' 超出 0-100 范围，请修正
    severity: error
  - field: tolerance.weight_kg
    rule: 值必须 >= 0
    message: 重量容差 '{value}' 不得小于 0
    severity: error
  - field: tolerance.quantity
    rule: 值必须 >= 0
    message: 数量容差 '{value}' 不得小于 0
    severity: error
  - field: tolerance.time_days
    rule: 值必须 >= 0
    message: 时间容差 '{value}' 不得小于 0
    severity: error

text_preprocessing:
  - type: replace
    pattern: '我我司'
    replacement: '我司'
    description: 修正原文及 PDF 提取中的重复字
  - type: replace
    pattern: '1\.\.'
    replacement: '1.'
    description: 修正编号前的重复句点
  - type: replace
    pattern: '(?m)^\s*(\d+)\.\s*\n+\s*'
    replacement: '\1.'
    description: 拼回被物理换行截断的编号
  - type: replace
    pattern: '水单现阶段是跟业务部要[^；。\n]*?直接采集'
    replacement: ''
    description: 删除水单采集方式的流程备注，不生成审查规则
  - type: replace
    pattern: '[ \t]{3,}'
    replacement: ' '
    description: 压缩 PDF 版面产生的连续空白，保留换行和表格边界

# 故意不配置业务文件名的全局字符串替换。
# 当前 term_normalization 是朴素 replace，“委托出口代理订单→委托出口确认单”会破坏原文括号
# 中的替代写法，也可能改变组合齐套语义。规范名由 prompt、ontology 和文档类型别名负责。
term_normalization: {}

domain_context:
  glossary:
    贸易场景: "出口-代理（退税）、出口-代理（不退税）、出口-自营、进口-代理、进口-自营、转口-代理、转口-自营、内贸-自营。"
    核心单据名称: "代理协议、框架协议、委托出口确认单、委托进口货物确认单、委托采购确认单、委托销售确认单、采购合同、销售合同、出口报关单、进口报关单、运输资料、货物签收单、派车单、出入仓单、收款水单、付款水单、货权凭证。"
    常用字段: "合同号、订单号、外部合同号、协议方、委托方、客户、供应商、收货单位、消费使用单位、产品名称、规格型号、原产地、数量、金额、结算条款、货物交付日期、交货地点、代理费、单据日期、产品数量。"
    N9B系统: "客户内部贸易业务系统，包含系统合同、制单界面、报关草单界面、印章申请附件、发货单、综合订单等信息，是单据内容与系统内容比对的基准源。"
    抽检合同清单: "以附件形式入系统的合同号清单，用于确定本批需要校验的合同；先用清单合同号匹配资料，再关联 N9B 系统内容。"
    回签: "合同或协议双方签署并盖章确认的版本。"
    协议时间覆盖合同时间: "协议有效期起始日不得晚于合同签订日，且有效期截止日不得早于合同签订日。"
    委托出口确认单: "代理出口业务的委托凭证，也写作委托出口代理订单。"
    委托进口货物确认单: "代理进口业务的委托凭证，也写作委托进口代理订单或委托进口确认单。"
    委托采购确认单: "转口代理采购业务的委托凭证，与采购订单是组合关系，不等同于采购合同。"
    委托销售确认单: "转口代理销售业务的委托凭证，与销售订单是组合关系，不等同于销售合同。"
    运输资料组合: "快递单、海运提单、空运提单、铁路运单任一可单独满足；上述任一运输单据加货物签收单也可满足；派车单（公路运输）加货物签收单也可满足。"
    大合同分批: "框架合同分批执行时，单次出入库数量可与合同总量不同；需累计检查，并对不等于合同单次数量但可能属于分批执行的情况提示人工确认。"
    虚仓: "系统发货单中的虚拟仓库选项；点选虚仓通常意味着实际走物流，可能触发派车单要求。"
    香港仓集拼: "进口业务香港仓快进快出场景，可只有供应商交货并加盖香港收货章的入仓文件，没有香港仓出仓文件。"
    先收后付: "收款水单到账时间通常应早于付款水单付款时间；进口代理场景税款除外。"
    第三方来款说明: "收款对象与系统客户不一致时，系统内用于解释第三方代付或代收的附件；有该附件时可按原文例外处理。"
    备案印章说明: "回签文件印章与协议签署印章不一致时，协议内记录的可用其他印章说明；有说明时按原文例外处理。"
    货权凭证: "转口自营中证明我司实际掌握货权的订舱、放货或运输费用账单等凭证；文件上货主或账单购方应体现我司。"
    人工确认语义: "原文写明可以接受、待进一步人工确认或建议补充说明的事项，应保留触发条件与复核意图，不能在解析时直接改写成硬性不通过。"
  common_patterns:
    - "表格归桶顺序固定为：强控是否必备→齐套性；不看单据内容的基础判断→基础判断；单据信息准确性→信息准确性；时间逻辑→时间逻辑。"
    - "每个贸易类型×模式都有独立场景；相同单据出现在不同场景时应分别生成规则，不能因为文本相似而合并。"
    - "代理场景比较基准通常是委托出口确认单或委托进口货物确认单；自营场景通常比较框架协议、采购合同、销售合同和报关单。"
    - "数量和金额比较链：报关单不大于委托确认单或销售合同；签收数量不大于委托确认单或销售合同，同时等于对应报关单的产品数量；采购合同同规格数量不小于销售合同数量。"
    - "常用时间链：协议覆盖合同；委托/订单时间在协议范围内；合同不晚于报关；报关不晚于后续物流或签收；资金时间与结算条款联动。"
    - "运输时间是方向敏感的：出口国内运输通常为物流时间不晚于报关时间，出口至香港时可能反转为物流时间不早于报关时间；进口自营国内运输为物流时间不早于报关时间，香港包车运输开始时间不晚于报关时间。必须按具体贸易类型和模式取值，不得套用单一公式。"
    - "出入仓数量检查包含逐单据数量、累计出入库数量、入库与出库数量关系，以及大合同分批执行的人工确认语义，应分别成为可独立复核的判定。"
    - "主体一致性链通常检查：协议方与委托方；报关单客户与销售合同客户；报关单消费使用单位与订单收货单位；签收单收货方与订单客户或销售合同客户；收付款对象与系统客户或供应商。"
    - "系统内容比对优先保留 N9B 具体界面名称和字段清单；没有可用的上传单据作为另一侧证据时，不生成虚假的 COMPARE_TO 结构。"
