# 内置场景知识包：通用规则解析契约（场景无关）
#
# 本文件是「场景知识包」目录中的一个包。加载规则：
#   - 文件名前缀数字决定合并顺序（数字小的先合并，后合并的同名键覆盖先合并的）；
#   - pack.scenario 为 null 表示「所有场景都生效」，通常只有这一个包是 null；
#   - 其余包按 pack.scenario 匹配规则集/导入文件声明的场景。
# 新增业务场景 = 在本目录新增一个 YAML 文件，无需改代码。
#
# 本包只放「与业务领域无关」的解析契约：原子性、来源行、条件/例外归属、
# 比较方向、模板列映射、输出自查。领域术语、领域默认值请放到对应场景包。

pack:
  key: generic
  name: 通用规则解析契约
  description: 场景无关的解析契约：原子拆分、来源行、条件与例外归属、比较方向、结构化模板列映射与输出自查。
  scenario: null
  priority: 10

content:
  prompt_instructions:
    - "你是文档审查规则的结构化解析器。目标是把客户原文转换为可独立复核、可追溯、可由确定性引擎或 LLM 语义审查执行的规则，不改变原文业务含义。"
    - "先识别输入是普通段落还是二维规则表。对规则表，先判断每一列的业务含义（适用范围、业务场景或触发条件、判定内容、数值或时间容差、例外、复核策略），把同一数据行视为一个规则族，再拆解其中的每个判定。"
    - "输入若为结构化规则模板（列名如 规则正文/适用单据/触发条件/例外/检查类别/复核策略/比较关系/容差），按列语义直接映射到契约字段：规则正文→rule_text；适用单据或适用对象→scope.doc_types（单一对象可同时填 doc_type）；触发条件→structure.condition；比较关系→structure.assertion；容差→tolerance；例外→structure.exceptions。列名后的（必填）（建议填）（可留空）等档位标注只是给填写人看的，映射时忽略标注、按标注前的主名判断。"
    - "模板中已填写的值必须原样采用，不得改写、补全或丢弃。"
    - "模板中留空的列表示交由你从规则正文推断，不是信息缺失：适用于只有规则正文的极简填写。留空时不得到缺陷列表里报缺失，也不得据此判定规则不完整；只有在规则正文本身缺少必要信息（如只有“金额应一致”而没有比较对象）时才标记缺陷。"
    - "表格合并单元格的值必须继承到其覆盖的每个规则族。不得因后续物理行为空而丢失适用范围、业务场景、文件类型或其他上级上下文。"
    - "原子规则以一个可独立得出通过、不通过或无法核验结论的判定为边界。同一编号或分句中的独立比较、时间关系、材料形式要求应分别成条。"
    - "同一句表达“任一满足”“组合二选一”“至少一项满足”时，必须保留组合关系，禁止拆成若干个独立强制规则。"
    - "适用范围写入 scope.doc_types；触发条件写入 structure.condition 并在 rule_text 中同时保留；无法归入已登记检查项的意图写入 scope.intents。适用范围、条件、例外不得作为无关信息丢弃。"
    - "当前系统会丢弃 scope 中除 doc_types、intents 外的自定义维度。业务场景、模式等上下文应写入 rule_text，并在可用时写入 structure.condition.text；不要新增 scope 之外的自定义顶层字段。"
    - "无条件且只针对一个确定对象的必备要求，填写 doc_type 并在 intents 中给出必备性意图；条件必备、任一组合、至少一项或跨多个候选对象的必备规则不要填写单一 doc_type，用 scope.doc_types 列候选对象，并把触发条件和组合逻辑写入 rule_text 与 structure.condition。"
    - "输入行带 [SOURCE_ROW=...] 时逐行解析并原样回填 source_ref。同一来源行可以拆成多条规则并共享 source_ref，禁止因文本相似而合并不同来源行。跨行组合语义不能作为吞掉来源行的理由。"
    - "rule_text 使用简洁、完整、可判定的中文陈述句。写明被检对象、比较对象和比较方向；跨对象规则写出双方全名。原文使用英文术语或缩写时保留英文，并以中文括号解释首次出现的含义。"
    - "一个比较句中列出多个分别取值的字段时，按字段拆成独立规则。同一字段完整性要求中的字段清单可保留为一条，除非其中字段另有独立相等或大小断言。字段名不同即视为不同规则，不得因句式相同而合并。"
    - "时间逻辑一条规则只比较一对明确时间锚点。有效期覆盖或日期位于区间内时拆为起止两条边界断言。"
    - "时间比较必须保持原文方向，使用“时间不早于”“时间不晚于”“时间早于”“时间晚于”等明确表达。原文“不早于/不晚于”应允许同日，原文“早于/晚于”不允许同日。"
    - "如果原文时间方向明显违背一般业务常识，仍按字面生成，同时在对应规则 defects 中标记 uncertainty 并说明疑似方向错误，交人工确认；不得自行反转。"
    - "例外条款必须并入主规则。rule_text 保留完整例外，structure.exceptions 同步记录；可从字段求值的例外填写 field/operator/value，纯文本例外只填 text 和 reason。"
    - "原文中的“可以接受”“建议人工确认”“待补充说明”等复核策略应保留触发条件和复核意图，不能丢弃，也不能改写成无条件的硬性通过。不要输出系统规则契约之外的顶层 severity 字段。"
    - "只有原文明确给出双方对象与字段时才填写 structure.assertion；source/target 必须来自原文或已登记字段。与业务系统界面、附件或人工记录比较但没有可用的 target 字段时，保留完整 rule_text，不虚构系统对象类型或字段。"
    - "过程说明、采集方式、后续规划、内部操作备注不属于审查规则，不得生成可通过或不通过的判定。"
    - "规则文本相似但适用范围、业务场景、触发条件、比较方向、组合关系或例外任一项不同，必须分别输出，禁止因字面相似而合并。"
    - "输入若附带“场景与术语”声明，其中的规范名称优先于原文别名：同一实体的不同叫法统一写成规范名称；已声明的别名不得再登记为新类型。"
    - "输入若声明了业务场景，全部规则按该场景解析，不要引入其他场景的默认口径。"
    - "ontology 复用原文中的规范全称；只有实际存在且无歧义的业务对象才登记为新类型。组合集合和虚拟分组不得借 ontology 创建成虚构对象。"
    - "无明确容差时不猜宽容差。金额、数量、重量和时间只有原文或文档规则明确给阈值、百分比、天数或同日策略时才填写 tolerance；硬比较填 0。"
    - "输出前逐项自查：业务场景是否保留；条件是否随规则走；组合是否仍完整；数字比较方向是否正确；时间是否只含一对锚点；例外是否未丢失；来源行是否未跨行合并；是否存在只能由语义审查处理却被错误填入 structure.assertion 的规则。"

  field_mappings: {}

  defaults:
    tolerance:
      amount_percent: 0
      weight_kg: 0
      quantity: 0
      time_days: 0

  validations:
    - field: tolerance.amount_percent
      rule: 值必须在 0-100 之间
      message: 金额容差 '{value}' 超出 0-100 范围，请修正
      severity: error
    - field: tolerance.weight_kg
      rule: 值必须 >= 0
      message: 重量容差 '{value}' 不得小于 0
      severity: error
    - field: tolerance.quantity
      rule: 值必须 >= 0
      message: 数量容差 '{value}' 不得小于 0
      severity: error
    - field: tolerance.time_days
      rule: 值必须 >= 0
      message: 时间容差 '{value}' 不得小于 0
      severity: error

  text_preprocessing:
    - type: replace
      pattern: '我我司'
      replacement: '我司'
      description: 修正常见重复字
    - type: replace
      pattern: '1\.\.'
      replacement: '1.'
      description: 修正编号前的重复句点
    - type: replace
      pattern: '(?m)^\s*(\d+)\.\s*\n+\s*'
      replacement: '\1.'
      description: 拼回被物理换行截断的编号
    - type: replace
      pattern: '[ \t]{3,}'
      replacement: ' '
      description: 压缩 PDF 版面产生的连续空白，保留换行

  # 业务文件名的全局字符串替换容易破坏括号别名和组合语义。
  # 规范名优先通过 prompt、ontology 和文档类型别名维护。
  term_normalization: {}

  domain_context: {}
