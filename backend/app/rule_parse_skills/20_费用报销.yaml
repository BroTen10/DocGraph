# 内置场景知识包：费用报销审查
#
# 场景键 scenario = expense。规则集或导入文件声明场景为 expense 时加载本包，
# 与 00_通用解析契约.yaml 叠加。
#
# 本包是「新业务场景 = 新增一个 YAML 文件」的现成范例：
# 复制本文件为 30_<你的场景>.yaml，改 pack 段与内容即可接入新领域，无需改代码。

pack:
  key: expense
  name: 场景包：费用报销
  description: 企业费用报销审查领域知识：票据形式、金额一致性口径、时间链、审批层级与常见例外。
  scenario: expense
  priority: 60

content:
  prompt_instructions:
    - "费用报销领域按“业务发生 → 取得票据 → 填报报销单 → 审批 → 支付”的主线理解原文，区分事前审批要求与事后报销要求。"
    - "票据形式要求（发票专用章、验真、票面要素完整、是否可抵扣）与报销单形式要求（申请人签字、审批层级、附件）属于不同证据维度，必须分别成条。"
    - "金额一致性默认口径为“票据价税合计之和 = 报销单报销金额”；存在多张票据时用汇总（aggregate=SUM）语义，不要拆成逐张与报销单总额比较。"
    - "金额包含税额、折扣、个人承担部分时要写明口径；原文未说明口径时保留完整 rule_text 并在 defects 中标记 uncertainty，由人工确认。"
    - "时间逻辑逐对比较票据开票日期、费用发生日期、报销单提交日期、审批日期与支付日期，不要预设所有企业遵循同一条固定时间链。"
    - "审批层级类规则依赖金额阈值、人员级别或城市类别：原文给出阈值时必须写入可求值的 condition 与 tolerance，缺失级别/城市字段时不要臆造字段。"
    - "常见例外（电子发票、免税或零税率、跨年度报销、代垫费用、公司卡支付、超标准部分自理）必须并入主规则，不得拆成独立规则或直接丢弃。"
    - "重复报销、票号唯一性、同一费用多头报销等要求按原文保留；缺少历史报销数据字段时不要虚构 target 字段，交语义审查处理。"

  field_mappings:
    check_category:
      齐全性: 齐套性
      附件齐全: 齐套性
      票据形式: 基础判断
      审批合规: 基础判断
      金额一致性: 信息准确性
      费用标准: 信息准确性
      时限: 时间逻辑

  defaults:
    priority:
      齐套性: 10
      基础判断: 20
      信息准确性: 30
      时间逻辑: 40

  domain_context:
    glossary:
      报销单: "员工提交的费用报销单据，含申请人、费用承担主体、报销金额、审批记录等。"
      票据: "发票、收据、行程单、电子发票等费用凭证；形式审查与金额审查分开处理。"
      价税合计: "发票金额合计口径；比对报销金额时默认使用该口径。"
      出差审批单: "出差前提交并获得批准的申请单据，可作为行程与标准的依据。"
      审批层级: "按金额阈值或人员级别要求的审批人层级组合，如部门负责人加财务负责人双签。"
      代垫费用: "由个人先行支付后报销的费用，申请人可与费用发生人不同。"
      跨年度报销: "费用发生年度与报销年度不一致的情形，通常需要额外审批说明。"
      公司卡支付: "由公司账户直接支付的费用，通常不再重复报销。"
    common_patterns:
      - "差旅类规则通常同时涉及标准（住宿/交通上限）、票据齐套（行程单/审批单）与时间逻辑，应按判定分别成条。"
      - "含税与不含税金额、个人承担与公司承担部分的差异必须在规则文本中写明口径。"
      - "同一张票据重复报销属于跨记录检查，当前以语义审查为主，不要臆造可比对的历史字段。"
