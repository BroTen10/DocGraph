# ============================================================================
# 场景知识包模板（复制本文件到 backend/app/rule_parse_skills/ 下即可接入新业务场景）
#
# 步骤：
#   1. 复制为 30_<你的场景>.yaml（文件名前缀数字决定合并顺序，建议 30 起）；
#   2. 修改 pack.key / pack.scenario / pack.name / pack.description；
#      scenario 是场景键，客户在规则描述文档的「场景与术语」表里填同一个值即可命中；
#   3. 只保留真正属于本领域的口径——通用规则已在 00_通用解析契约.yaml 中，不要重复；
#   4. 重启后端：启动时会把本包幂等同步成一条内置 Skill（scenario=<你的场景键>）；
#   5. 让客户用《规则描述文档模板》填写规则文档，场景列填你的场景键，导入即可生效。
#
# 注意：
#   - 通用契约包（scenario: null）全系统唯一，本文件不要写 null；
#   - 领域术语不要写进 prompt_instructions，统一放 domain_context.glossary；
#   - 新增本文件后，不需要改任何 Python 代码。
# ============================================================================

pack:
  key: your-scenario            # 包标识，建议与文件名一致
  name: 场景包：<业务领域名称>
  description: <一句话说明本场景覆盖的审查口径>
  scenario: your-scenario       # 场景键：客户在导入文件里声明的值
  priority: 70                  # 合并顺序；数值大者后合并，同名键覆盖先合并的

content:
  # ---- 领域特有的解析口径（3~10 条为宜，写“领域约定”，不写通用规则）----
  prompt_instructions:
    - "<本领域的业务主线，例：先区分事前审批与事后执行，再谈单据要求>"
    - "<本领域常见的“同一句话里混了多个证据维度”，说明应如何分开成条>"
    - "<本领域的金额/数量/时限比对默认口径，例：多张票据用汇总而非逐张比对>"
    - "<本领域必须保留的例外类型，例：免税、跨年度、个人承担部分>"
    - "<本领域容易臆造的字段或对象，说明缺字段时应保留原文交语义审查>"

  # ---- 检查类别的同义词归一（把原文里的叫法收敛到规则集已登记的类别）----
  field_mappings:
    check_category:
      齐全性: 齐套性
      形式审查: 基础判断
      金额一致性: 信息准确性
      时限: 时间逻辑

  # ---- 按检查类别给优先级建议（数字越小越先执行）----
  defaults:
    priority:
      齐套性: 10
      基础判断: 20
      信息准确性: 30
      时间逻辑: 40

  # ---- 领域术语表：帮助模型理解业务词，避免同一对象多个名字 ----
  domain_context:
    glossary:
      示例术语: "一句话解释本领域专有名词的业务含义。"
    common_patterns:
      - "<本领域常见的规则形态，例：金额类规则通常涉及哪些对象>"
      - "<本领域常见的陷阱，例：不要预设所有业务都遵循同一条时间链>"
